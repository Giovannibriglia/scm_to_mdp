[project]
name = "scm-to-mdp"
version = "0.1.0"
description = "Code and experiments for the SCM -> MDP-family pipeline (paper code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "adjusttext>=1.3",
    "gadjid>=0.1.0",
    "highspy>=1.15.1",
    "matplotlib>=3.7",
    "nbn>=0.27",
    "numpy>=1.24",
    "pandas>=2",
    "psutil>=7",
    "scipy>=1.10",
    "torch>=2.6",
    "tqdm>=4.65",
]

[project.optional-dependencies]
discovery = [
    "pgmpy>=1.1",
    "tigramite>=5.2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

# PyTorch: macOS and Linux arm64 take PyPI's wheel; Linux x86_64 takes the CUDA 12.6 build, which runs
# with NVIDIA drivers from CUDA 12.x on and supports Pascal to Hopper GPUs (PyPI's default Linux wheel
# is built for CUDA 13 and needs a recent driver). On a machine without a usable GPU it runs on the
# CPU. For Blackwell GPUs (RTX 50xx, B200), change cu126 to cu128 or later here and run `uv lock`.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_to_mdp"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
