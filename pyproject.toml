[project]
name = "scm-to-mdp"
version = "0.1.0"
description = "Code and experiments for the SCM -> MDP-family pipeline (paper code)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gadjid>=0.1.0",
    "matplotlib>=3.7",
    "nbn>=0.26",
    "numpy>=1.24",
    "pandas>=2",
    "psutil>=7",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[project.optional-dependencies]
discovery = [
    "pgmpy>=1.1",
    "tigramite>=5.2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_to_mdp"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
